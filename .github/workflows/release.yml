# Builds the signed release APK when a GitHub release is published and attaches it to that release
# as netrik-release.apk (plus its SHA-256 checksum).
#
# Required repository secrets:
#   NETRIK_KEYSTORE_BASE64    release keystore (.jks), base64-encoded
#   NETRIK_KEYSTORE_PASSWORD  keystore password
#   NETRIK_KEY_ALIAS          key alias
#   NETRIK_KEY_PASSWORD       key password
# Optional repository variable:
#   NETRIK_CERT_SHA256        expected SHA-256 of the signing certificate; the build fails on a mismatch.
#
# The release tag must look like v1.2.3: it becomes versionName 1.2.3 and versionCode 1002003.
name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Passed through the environment, never interpolated into scripts.
      TAG: ${{ github.event.release.tag_name }}
      BUILD_TOOLS: "37.0.0"
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check the tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::Release tag must look like v1.2.3, got '$TAG'."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NETRIK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret NETRIK_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netrik-release.jks"
          echo "NETRIK_KEYSTORE_FILE=$RUNNER_TEMP/netrik-release.jks" >> "$GITHUB_ENV"

      - name: Run the unit tests
        run: ./gradlew test

      - name: Build the signed release APK
        env:
          NETRIK_KEYSTORE_PASSWORD: ${{ secrets.NETRIK_KEYSTORE_PASSWORD }}
          NETRIK_KEY_ALIAS: ${{ secrets.NETRIK_KEY_ALIAS }}
          NETRIK_KEY_PASSWORD: ${{ secrets.NETRIK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pnetrik.version="$TAG" -Pnetrik.requireSigning=true

      - name: Verify the signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.NETRIK_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          # "V3.0 Signer: certificate SHA-256 digest: <hex>" (older build tools: "Signer #1 certificate ...").
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: //p' | head -n 1)
          echo "Signing certificate SHA-256: $CERT"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "::error::The APK was signed with an unexpected certificate."
              exit 1
            fi
          fi
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk netrik-release.apk
          sha256sum netrik-release.apk > netrik-release.apk.sha256
          cat netrik-release.apk.sha256
          gh release upload "$TAG" netrik-release.apk netrik-release.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/netrik-release.jks"
